<div class="leaderboard-container">
  <mat-card class="leaderboard-card">
    <mat-card-title>🏆 Leaderboard</mat-card-title>
    <mat-card-subtitle>Top 10 players by wins</mat-card-subtitle>

    <!-- Loading spinner -->
    <div *ngIf="isLoading" class="spinner-container">
      <mat-spinner></mat-spinner>
    </div>

    <!-- Empty state -->
    <div *ngIf="!isLoading && leaderboard.length === 0" class="empty-state">
      <p>No games played yet. Be the first! 🎮</p>
      <button mat-raised-button color="primary" routerLink="/game">
        Play Now
      </button>
    </div>

    <!-- Leaderboard table -->
    <table *ngIf="!isLoading && leaderboard.length > 0"
      mat-table [dataSource]="leaderboard" class="leaderboard-table">

      <!-- Rank column -->
      <ng-container matColumnDef="rank">
        <th mat-header-cell *matHeaderCellDef>Rank</th>
        <td mat-cell *matCellDef="let player; let i = index">
          <span class="rank" [class.gold]="i===0" [class.silver]="i===1" [class.bronze]="i===2">
            {{ i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : i + 1 }}
          </span>
        </td>
      </ng-container>

      <!-- Username column -->
      <ng-container matColumnDef="username">
        <th mat-header-cell *matHeaderCellDef>Player</th>
        <td mat-cell *matCellDef="let player">{{ player.username }}</td>
      </ng-container>

      <!-- Wins column -->
      <ng-container matColumnDef="wins">
        <th mat-header-cell *matHeaderCellDef>Wins</th>
        <td mat-cell *matCellDef="let player">
          <span class="wins-badge">{{ player.wins }}</span>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>

    <button mat-stroked-button color="primary" routerLink="/game" class="play-btn">
      Play Game
    </button>

  </mat-card>
</div>
